<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <nav>
    <div class="nav-links">
      <button type="button" id="addTaskBtnTop">+ Add</button>
      <button type="button" id="saveTasksBtn">Save</button>
      <button type="button" id="deleteCompletedBtn">Delete</button>
    </div>
  </nav>

  <header>
    <h1>To Do List</h1>
    <h4>Grind For your Future</h4>
  </header>

  <div class="AddTaskbar">
    <input type="text" id="taskInput" placeholder="Add Task" />
    <button type="button" id="addTaskButn">+ ADD</button>
  </div>

  <div class="list">
    <ul id="taskList" class="task-list"></ul>
  </div>

  <footer>© 2026 To Do List</footer>
</body>
</html>
